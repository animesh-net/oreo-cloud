# oreo-cloud, standing in on the Mac while the Pi is replaced. Immich v3.3.5 (same images
# as the Pi), renamed off vendor names so this project and the eventual Pi fold-in share one
# naming scheme — see the "vendor-agnostic container rename" plan for the full map.
# Changes from the official Immich compose file: project and container names renamed,
# /etc/localtime mount removed (TZ is set in .env instead), Immich's port kept on this Mac
# only (as on the Pi), and the Pi's Caddy added under the "proxy" profile. Start proxy only
# once this Mac holds the Pi's Tailscale address 100.70.213.121.
name: oreo-cloud

services:
  photos:
    container_name: oreo-cloud-photos
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/data
    env_file:
      - .env
    ports:
      - '127.0.0.1:2283:2283'
    depends_on:
      - cache
      - db
    restart: always
    healthcheck:
      disable: false

  photos-ml:
    container_name: oreo-cloud-photos-ml
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - oreo-cloud-photos-ml-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  cache:
    container_name: oreo-cloud-cache
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  db:
    container_name: oreo-cloud-db
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

  db-dump-copy:
    container_name: oreo-cloud-db-dump-copy
    image: docker.io/library/alpine:3.22
    # A second copy of Immich's nightly database dumps, on the Mac's own disk, in case the
    # Passport fails. Checks every hour, keeps 14 days.
    command:
      - sh
      - -c
      - >-
        while true; do
        for f in /data/backups/immich-db-backup-*.sql.gz; do [ -e "$$f" ] && cp -n "$$f" /dumps/; done;
        find /dumps -name 'immich-db-backup-*.sql.gz' -mtime +14 -delete;
        sleep 3600; done
    volumes:
      - ${UPLOAD_LOCATION}/backups:/data/backups:ro
      - ./db-dumps:/dumps
    restart: always

  proxy:
    container_name: oreo-cloud-proxy
    profiles: ['proxy']
    build: ./caddy
    restart: unless-stopped
    env_file: ./caddy/caddy.env
    ports:
      - '100.70.213.121:443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - oreo-cloud-proxy-data:/data
      - oreo-cloud-proxy-config:/config
    depends_on:
      - photos

volumes:
  oreo-cloud-photos-ml-cache:
  oreo-cloud-proxy-data:
  oreo-cloud-proxy-config:
