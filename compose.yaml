# The whole Pi: oreo's own containers, the photo app and the proxy, all named oreo-cloud-*
# after their role, the same scheme as mac/docker-compose.yml.
name: oreo-cloud

# Only /mnt is shared, not the whole host. The container's own / sits on the NVMe, so "/"
# already reports its usage. rslave: drives mounted after the container starts show up too.
x-mnt: &mnt
  type: bind
  source: /mnt
  target: /host/mnt
  read_only: true
  bind:
    propagation: rslave

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Settings (drive paths, alert thresholds, ...) are built into the image from
# config/settings.env; .env holds the required values and can override a setting. Set
# OREO_IMAGE_TAG to a sha-<commit> tag to roll back. This file ships in the image too:
# `docker run --rm ghcr.io/animesh-net/oreo-cloud show compose > compose.yaml` refreshes it.
x-env-file: &env-file
  - path: .env
    required: false

services:
  heartbeat:
    image: ghcr.io/animesh-net/oreo-cloud:${OREO_IMAGE_TAG:-latest}
    container_name: oreo-cloud-metrics
    # Host network: the heartbeat binds the Tailscale address itself and waits for it at boot,
    # because Docker does not retry a container whose port binding failed to start.
    network_mode: host
    restart: unless-stopped
    # PID 1 ignores SIGTERM unless it handles it; init forwards it so stops are immediate.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    logging: *logging
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env}"
    env_file: *env-file
    environment:
      OREO_HEARTBEAT_TOKEN: "${OREO_HEARTBEAT_TOKEN:?set OREO_HEARTBEAT_TOKEN in .env}"
      OREO_HEARTBEAT_HOST: "${OREO_BIND_IP:?set OREO_BIND_IP in .env}"
      # The heartbeat fails when the agent stops touching this file.
      OREO_AGENT_ALIVE_FILE: /var/lib/oreo/agent.alive
    volumes:
      # Alert state (what is already failing), so alerts are sent on change, not every run.
      - oreo-state:/var/lib/oreo
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - *mnt

  # Runs the recurring jobs (network watchdog, checks, nightly backup). It has root on the
  # host so `oreo net` can renew the lease and restart Wi-Fi, so it publishes no port and
  # runs no code except this image's.
  agent:
    image: ghcr.io/animesh-net/oreo-cloud:${OREO_IMAGE_TAG:-latest}
    command: ["agent"]
    container_name: oreo-cloud-agent
    hostname: oreo-cloud
    restart: unless-stopped
    init: true
    user: root
    privileged: true
    pid: host
    read_only: true
    tmpfs:
      - /tmp
    # restic needs a few hundred MB while it backs up.
    mem_limit: 1g
    logging: *logging
    env_file: *env-file
    environment:
      # The agent is what sends alerts, so it refuses to start without somewhere to send them.
      OREO_NTFY_URL: "${OREO_NTFY_URL:?set OREO_NTFY_URL in .env}"
    healthcheck:
      # The agent touches this file every 15 seconds; stale means the loop has stopped.
      test:
        - CMD
        - python
        - -c
        - import os, sys, time; sys.exit(time.time() - os.path.getmtime('/var/lib/oreo/agent.alive') > 120)
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - oreo-state:/var/lib/oreo
      - /var/run/docker.sock:/var/run/docker.sock
      # The storage lock the host's oreo-update also takes, so a backup and an update never overlap.
      - /run/lock:/run/lock
      # What `oreo backup` saves, read-only; snapshots record these /host paths.
      - /etc:/host/etc:ro
      - /home/animesh:/host/home/animesh:ro
      - /usr/local/bin:/host/usr/local/bin:ro
      - /var/lib/tailscale:/host/var/lib/tailscale:ro
      - /boot/firmware:/host/boot/firmware:ro
      - /var/spool/cron:/host/var/spool/cron:ro
      - *mnt

  # The photo app (Immich). Updated only with `update immich`, which takes a database dump
  # first, so the pull commands elsewhere name the other services instead of pulling these.
  photos:
    container_name: oreo-cloud-photos
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      - ${UPLOAD_LOCATION:?set UPLOAD_LOCATION in .env}:/data
      - /etc/localtime:/etc/localtime:ro
    environment: &photos-env
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      # The renamed services don't match Immich's built-in default hostnames.
      DB_HOSTNAME: db
      REDIS_HOSTNAME: cache
      IMMICH_MACHINE_LEARNING_URL: http://photos-ml:3003
      TZ: ${OREO_TIMEZONE:-Asia/Kolkata}
    ports:
      - '127.0.0.1:2283:2283'
    depends_on:
      - cache
      - db
    restart: always
    logging: *logging
    healthcheck:
      disable: false

  photos-ml:
    container_name: oreo-cloud-photos-ml
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    volumes:
      - oreo-cloud-photos-ml-cache:/cache
    environment: *photos-env
    restart: always
    logging: *logging
    healthcheck:
      disable: false

  cache:
    container_name: oreo-cloud-cache
    # Valkey, republished on GHCR from cache/ by this repo's workflow.
    image: ghcr.io/animesh-net/oreo-cloud-cache:${OREO_IMAGE_TAG:-latest}
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always
    logging: *logging

  db:
    container_name: oreo-cloud-db
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION:?set DB_DATA_LOCATION in .env}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    logging: *logging
    healthcheck:
      disable: false

  # Caddy with the Cloudflare DNS module, built by this repo's workflow (proxy/), so the Pi
  # only pulls it. Serves cloud., pi. and ai.animesh.org.in on the Tailscale address.
  proxy:
    container_name: oreo-cloud-proxy
    image: ghcr.io/animesh-net/oreo-cloud-proxy:${OREO_IMAGE_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    logging: *logging
    # The Cloudflare token and the pi.animesh.org.in password hash, kept apart from .env so
    # the other containers never see them.
    env_file: proxy.env
    environment:
      OREO_BIND_IP: "${OREO_BIND_IP:?set OREO_BIND_IP in .env}"
    volumes:
      - oreo-cloud-proxy-data:/data
      - oreo-cloud-proxy-config:/config
    depends_on:
      - photos

volumes:
  oreo-state:
  oreo-cloud-photos-ml-cache:
  oreo-cloud-proxy-data:
  oreo-cloud-proxy-config:
