services:
  oreo:
    image: ghcr.io/animesh-net/oreo-cloud:latest
    container_name: oreo
    hostname: oreo-cloud
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env}"
    environment:
      OREO_HEARTBEAT_TOKEN: "${OREO_HEARTBEAT_TOKEN:?set OREO_HEARTBEAT_TOKEN in .env}"
      OREO_NTFY_URL: "${OREO_NTFY_URL:-}"
      OREO_NTFY_TOKEN: "${OREO_NTFY_TOKEN:-}"
      OREO_DISK_PATHS: /host,/host/mnt/data-hot-ssd1
      OREO_MOUNT_PATHS: /host/mnt/data-hot-ssd1
    ports:
      - "${OREO_BIND_IP:-0.0.0.0}:8787:8787"
    volumes:
      # Alert state (what is already failing), so alerts are sent on change, not every run.
      - oreo-state:/var/lib/oreo
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # rslave: drives mounted after the container starts show up under /host too.
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave

volumes:
  oreo-state:
