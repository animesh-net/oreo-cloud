services:
  oreo:
    image: ghcr.io/animesh-net/oreo-cloud:latest
    container_name: oreo
    hostname: oreo-cloud
    restart: unless-stopped
    # PID 1 ignores SIGTERM unless it handles it; init forwards it so stops are immediate.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env}"
    environment:
      OREO_HEARTBEAT_TOKEN: "${OREO_HEARTBEAT_TOKEN:?set OREO_HEARTBEAT_TOKEN in .env}"
      OREO_NTFY_URL: "${OREO_NTFY_URL:-}"
      OREO_NTFY_TOKEN: "${OREO_NTFY_TOKEN:-}"
      OREO_DISK_PATHS: /,/host/mnt/data-hot-ssd1
      OREO_MOUNT_PATHS: /host/mnt/data-hot-ssd1
    ports:
      - "${OREO_BIND_IP:-0.0.0.0}:8787:8787"
    volumes:
      # Alert state (what is already failing), so alerts are sent on change, not every run.
      - oreo-state:/var/lib/oreo
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Only /mnt is shared, not the whole host. The container's own / sits on the NVMe,
      # so "/" already reports its usage. rslave: drives mounted after the container
      # starts show up under /host/mnt too.
      - type: bind
        source: /mnt
        target: /host/mnt
        read_only: true
        bind:
          propagation: rslave

  # Runs the recurring jobs (network watchdog, container and system checks). It has root on the
  # host so `oreo net` can renew the lease and restart Wi-Fi, so it publishes no port and
  # runs no code except this image's.
  agent:
    image: ghcr.io/animesh-net/oreo-cloud:latest
    command: ["agent"]
    container_name: oreo-agent
    hostname: oreo-cloud
    restart: unless-stopped
    init: true
    user: root
    privileged: true
    pid: host
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      OREO_NTFY_URL: "${OREO_NTFY_URL:-}"
      OREO_NTFY_TOKEN: "${OREO_NTFY_TOKEN:-}"
      OREO_DISK_PATHS: /,/host/mnt/data-hot-ssd1
      OREO_MOUNT_PATHS: /host/mnt/data-hot-ssd1
    healthcheck:
      # The agent touches this file every 15 seconds; stale means the loop has stopped.
      test:
        - CMD
        - python
        - -c
        - import os, sys, time; sys.exit(time.time() - os.path.getmtime('/var/lib/oreo/agent.alive') > 120)
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - oreo-state:/var/lib/oreo
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /mnt
        target: /host/mnt
        read_only: true
        bind:
          propagation: rslave

volumes:
  oreo-state:
