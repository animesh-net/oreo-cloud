[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oreo"
version = "0.1.0"
description = "Operations CLI for the oreo-cloud Raspberry Pi home server"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
oreo = "oreo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oreo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
